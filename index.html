:root{

  --accent:#1D4FFF;--accent-ink:#FFFFFF;--accent-soft:#E2E9FF;
  --water:#0B8FA6;--carb:#D98A00;--fat:#6A7B8E;--good:#157F55;--warn:#A86A00;--bad:#C0392B;
  --shadow:0 1px 2px rgba(18,32,45,.06),0 6px 20px rgba(18,32,45,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#6F90FF;--accent-ink:#0B1220;--accent-soft:#1E2D52;
  --water:#37B8CF;--carb:#F0A92B;--fat:#93A4B6;--good:#3FC48B;--warn:#E8A93A;--bad:#F0786B;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#6F90FF;--accent-ink:#0B1220;--accent-soft:#1E2D52;
  --water:#37B8CF;--carb:#F0A92B;--fat:#93A4B6;--good:#3FC48B;--warn:#E8A93A;--bad:#F0786B;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.shell{max-width:560px;margin:0 auto;padding-block:14px 112px}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:36px;line-height:1.02}h2{font-size:26px;line-height:1.1}
h3{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h4{font-size:20px}p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.05em;background:var(--ink);color:var(--bg);padding:1px 9px;border-radius:7px}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.03em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}.stack.s8{gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.big{font-size:44px;line-height:1}.mid{font-size:28px;line-height:1}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px var(--body);width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.chip.good{background:transparent;border:1px solid var(--good);color:var(--good)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{min-width:0}.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;min-width:36px;min-height:36px;cursor:pointer;border-radius:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:10px;
  color:var(--muted);font:600 11px var(--body);padding:6px 0;min-height:48px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%;text-align:center}
.ring{position:relative;width:176px;height:176px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:26px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid var(--water);background:transparent}
.drop.on{background:var(--water)}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.player .inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.bigtime{font-family:var(--display);font-weight:700;font-size:clamp(84px,28vw,140px);line-height:1;font-variant-numeric:tabular-nums}
.phase{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.phase.rest{color:var(--water)}.phase.work{color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px}

.tip{display:flex;gap:10px;align-items:flex-start}

.tip.warn i{background:var(--warn)}.tip.good i{background:var(--good)}
.scroll-x{overflow-x:auto}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pwrap{position:relative;min-width:0}
.photo{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:3/4;padding:0;border-radius:10px;border:1px dashed var(--muted);background:var(--surface2);color:var(--muted);font:600 12px var(--body);overflow:hidden;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:focus-visible,.del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.del{position:absolute;top:3px;right:3px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(10,16,24,.7);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.tog{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:500 15px var(--body);text-align:left;cursor:pointer}

table.tb{border-collapse:collapse;font-size:13px;min-width:700px;width:100%}
table.tb th,table.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

async function initRemote() {
  try {
    const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
    if (!use) return;
    const [db, user] = await Promise.all([use("db"), use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    DB = db; UID = id;
    setSync("Sincronizando…");
    const pSnap = await refDoc("profile").get();
    const dSnap = await refDoc("profile").collection("days").orderBy("u", "desc").limit(400).get();
    const rp = pSnap.exists ? pSnap.data() : null;
    if (rp && (!S.profile || (rp.u || 0) > (S.profile.u || 0))) S.profile = JSON.parse(JSON.stringify(rp));
    else if (S.profile && (!rp || (S.profile.u || 0) > (rp.u || 0))) queueRemote("profile", "", S.profile);
    const remote = {};

    Object.keys(remote).forEach(k => {
      if (!S.days[k] || (remote[k].u || 0) > (S.days[k].u || 0)) S.days[k] = JSON.parse(JSON.stringify(remote[k]));
    });
    Object.keys(S.days).forEach(k => {
      const d = S.days[k];
      if ((d.u || 0) > 0 && (!remote[k] || d.u > (remote[k].u || 0))) queueRemote("day", k, d);

// ---------- metas ----------
const bmi = p => p.peso / Math.pow(p.estatura / 100, 2);
function calcTargets(p) {
  const bmr = 10 * p.peso + 6.25 * p.estatura - 5 * p.edad + (p.sexo === "m" ? 5 : -161);
  const tdee = bmr * p.act;
  let goal = p.objetivo;
  if (goal === "bajar" && bmi(p) < 19) goal = "mantener";
  const adj = goal === "bajar" ? 0.85 : goal === "subir" ? 1.1 : 1;
  const floor = p.sexo === "m" ? 1500 : 1200;
  const kcal = Math.max(floor, Math.round(tdee * adj / 10) * 10);
  const prot = Math.round(p.peso * (goal === "mantener" ? 1.6 : 1.9));
  const fat = Math.round(kcal * 0.27 / 9);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  const agua = Math.max(1500, Math.round(p.peso * 35 / 250) * 250);
  return {kcal, prot, fat, carb, agua, tdee: Math.round(tdee), bmr: Math.round(bmr), goal, limited: goal !== p.objetivo};
}
function dayTotals(d) {
  const t = {k: 0, p: 0, c: 0, f: 0};
  MEALS.forEach(([id]) => (d.meals[id] || []).forEach(e => { t.k += e.k; t.p += e.p; t.c += e.c; t.f += e.f; }));
  return t;
}
const burned = d => (d.work || []).reduce((a, w) => a + (w.kcal || 0), 0);
function streak() {
  let n = 0, k = todayKey();
  const has = key => { const d = S.days[key]; return d && (dayTotals(getDay(key)).k > 0 || (d.work && d.work.length)); };
  if (!has(k)) k = addDays(k, -1);
  while (has(k)) { n++; k = addDays(k, -1); }
  return n;
}
function lastWeight(p) { const w = p.pesos && p.pesos.length ? p.pesos[p.pesos.length - 1].kg : p.peso; return w; }

  if (tot.k > t.kcal * 1.1) out.push({k: "warn", m: "Hoy te pasaste un poco de tu meta. No lo compenses saltándote comidas: mañana vuelves a tu plan y listo."});

  if (h >= 14 && d.agua < t.agua * 0.4) out.push({k: "warn", m: "Llevas " + fmt(d.agua / 1000, 1) + " de " + fmt(t.agua / 1000, 1) + " L de agua. Toma un vaso ahora y deja una botella a la vista."});
  if (tot.k >= t.kcal * 0.9 && tot.k <= t.kcal * 1.05 && tot.p >= t.prot * 0.9) out.push({k: "good", m: "Excelente día: calorías y proteína en tu meta."});
  if (r && !done) out.push({k: "", m: "Hoy toca " + r.name + ". Si no tienes tiempo, aunque sea la mitad ya suma."});
  if (done) out.push({k: "good", m: "Entrenamiento de hoy listo. Cena con proteína y duerme bien para recuperar."});
  if (streak() >= 3) out.push({k: "good", m: "Llevas " + streak() + " días seguidos registrando. La constancia es lo que da resultados."});
  const lw = (p.pesos || []).length ? p.pesos[p.pesos.length - 1].d : null;
  if (lw && lw < addDays(k, -14)) out.push({k: "", m: "Hace más de dos semanas que no registras tu peso. Pésate una vez por semana, en ayunas, para ver la tendencia."});

    "Objetivo: " + t.goal + ". Nivel de calistenia: " + p.nivel + ", " + p.dias + " días por semana. Entrena " + (eqOf(p) === "casa" ? "en casa sin equipo (solo suelo, pared, silla y mochila con libros)" : "con barra y paralelas") + ".\n" +
    "Metas diarias: " + t.kcal + " kcal, proteína " + t.prot + " g, carbohidratos " + t.carb + " g, grasas " + t.fat + " g, agua " + t.agua + " ml.\n" +
    "Hoy: " + Math.round(tot.k) + " kcal, proteína " + Math.round(tot.p) + " g, carbohidratos " + Math.round(tot.c) + " g, grasas " + Math.round(tot.f) + " g, agua " + d.agua + " ml, entrenos " + d.work.length + ".\n" +
    "Comidas de hoy: " + comidas + ".\nCalorías de los 3 días anteriores (ayer primero): " + prev + ".";
}
let CHAT = [], CTL = null, SAMPLE_P = null, SAMPLE_OK = null;
const SUGG = ["¿Qué ceno hoy para llegar a mi proteína?", "Dame una colación de unas 150 kcal", "¿Cómo llego a mi primera dominada?", "Arma un menú de un día para mi meta"];
const bubbleHTML = (r, t) => '<div class="bubble ' + r + '">' + esc(t) + "</div>";
RENDER.ana = () => {
  const off = SAMPLE_OK === false;
  return '<div class="stack"><div><h1>Ana</h1><p class="muted">Tu coach de calistenia y orientadora de nutrición.</p></div>' +
    '<div class="stack s8"><h3>Hoy te recomiendo</h3>' + anaTips().map(x => '<div class="card tip ' + x.k + '"><i></i><p>' + esc(x.m) + "</p></div>").join("") + "</div>" +
    '<div class="card stack"><h3>Pregúntale a Ana</h3><div class="chat" id="chat">' +
    (CHAT.length ? CHAT.map(m => bubbleHTML(m.role === "user" ? "me" : "ana", m.content)).join("") : bubbleHTML("ana", "Hola, soy Ana. Cuéntame qué necesitas: ideas de comidas, ajustar tu rutina o cómo progresar en un ejercicio.")) + "</div>" +
    (CHAT.length || off ? "" : '<div class="seg">' + SUGG.map(q => '<button data-act="ask" data-q="' + esc(q) + '">' + esc(q) + "</button>").join("") + "</div>") +
    (off ? '<p class="small muted">El chat no está disponible en esta vista. Los consejos de arriba siguen funcionando con tus datos.</p>' : "") +
    '<div class="row"><input id="a-in" data-enter="send" placeholder="Escribe tu pregunta" maxlength="500"' + (off ? " disabled" : "") + '><button class="btn primary" id="a-btn" data-act="send"' + (off ? " disabled" : "") + ">Enviar</button></div>" +
    '<p class="note">Ana es una asistente de IA: orienta, pero no reemplaza a un médico ni a un nutricionista.</p></div></div>';
};
function addBubble(role, text) {
  const c = $("#chat"), d = document.createElement("div");
  d.className = "bubble " + role; d.textContent = text; c.appendChild(d); d.scrollIntoView({block: "nearest"});
  return d;
}
const copyFor = c => ({not_granted: "Ana no está habilitada en esta vista.", sampling_disabled: "Ana no está disponible para esta cuenta.", rate_limited: "Demasiadas consultas seguidas. Intenta de nuevo en un rato.",
  cancelled: "Detenido.", session_expired: "Vuelve a iniciar sesión para hablar con Ana."}[c] || "No pude responder ahora. Intenta de nuevo.");
ACT.ask = b => { $("#a-in").value = b.dataset.q; ACT.send(); };
ACT.send = async () => {
  if (CTL) { CTL.abort(); return; }
  const inp = $("#a-in"), msg = inp.value.trim();
  if (!msg) return;
  const sm = await SAMPLE_P;
  if (!sm) { SAMPLE_OK = false; render(); return; }
  inp.value = "";
  CHAT.push({role: "user", content: msg});
  addBubble("me", msg);
  const bub = addBubble("ana", "Pensando…"), btn = $("#a-btn");
  CTL = new AbortController(); btn.textContent = "Detener";
  try {
    const {text} = await sm([{role: "user", content: RULES + "\n\nDatos de la persona:\n" + anaContext()}].concat(CHAT.slice(-10)),
      {cache: false, signal: CTL.signal, onText: ({text}) => { bub.textContent = text; }});
    CHAT.push({role: "assistant", content: text});
  } catch (e) {
    if (e && e.text) { bub.textContent = e.text; CHAT.push({role: "assistant", content: e.text}); }
    else bub.textContent = copyFor(e && e.code);
  } finally {
    CTL = null; const b2 = $("#a-btn"); if (b2) b2.textContent = "Enviar";
  }
};

// ---------- inicio ----------
lsLoad();
render();
initRemote();
SAMPLE_P = (async () => {
  try {
    const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
    if (!use) { SAMPLE_OK = false; return null; }
    const s = await use("sample");
    SAMPLE_OK = !!s;
    if (!s && VIEW.tab === "ana" && !CHAT.length) render();
    return s;
  } catch (e) { SAMPLE_OK = false; return null; }
})();
// ---------- Versión instalable: respaldo de datos y modo sin conexión ----------
const _progresoBase = RENDER.progreso;
RENDER.progreso = () => {
  const card = '<div class="card stack s8"><h3>Respaldo de tus datos</h3>' +
    '<p class="small muted">Tus datos se guardan solo en este teléfono. Descarga un respaldo de vez en cuando, o úsalo para pasarlos a otro dispositivo. Restaurar reemplaza lo que hay ahora.</p>' +
    '<div class="row wrap"><button class="btn sm" data-act="exportdata">Descargar respaldo</button><button class="btn sm" data-act="pickimport">Restaurar respaldo</button></div>' +
    '<input id="importfile" data-in="importfile" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">' +
    '<p id="imp-msg" class="small" role="status"></p></div>';
  return _progresoBase().replace(/<\/div>$/, card + "</div>");
};
ACT.exportdata = () => {
  const blob = new Blob([JSON.stringify({app: "rh-calisthenics", v: 1, exported: new Date().toISOString(), data: S, fotos: FOTOS})], {type: "application/json"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "rh-calisthenics-respaldo-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Respaldo descargado");
};
ACT.pickimport = () => { const i = $("#importfile"); if (i) i.click(); };
INP.importfile = t => {
  const f = t.files && t.files[0], msg = txt => { const m = $("#imp-msg"); if (m) m.textContent = txt; };
  if (!f) return;
  if (f.size > 5e6) { t.value = ""; return msg("El archivo es demasiado grande."); }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result), d = o && o.data, p = d && d.profile;
      const ok = o && o.app === "rh-calisthenics" && d && typeof d.days === "object" && d.days && p &&
        isFinite(p.peso) && isFinite(p.estatura) && isFinite(p.edad) && (p.sexo === "f" || p.sexo === "m");
      if (!ok) throw new Error("formato");
      p.pesos = Array.isArray(p.pesos) ? p.pesos : [];
      p.custom = Array.isArray(p.custom) ? p.custom : [];
      p.agenda = p.agenda && typeof p.agenda === "object" ? p.agenda : {};
      S.profile = p; S.days = d.days;
      if (o.fotos && typeof o.fotos === "object") {
        FOTOS = {};
        Object.keys(o.fotos).forEach(k => { const v = o.fotos[k]; if (/^(0|4|8|12)-[fl]$/.test(k) && typeof v === "string" && v.indexOf("data:image/jpeg;base64,") === 0 && v.length < 400000) FOTOS[k] = v; });
        fotosSave();
      }
      lsSave(); render(); toast("Respaldo restaurado");
    } catch (e) { msg("No pude leer ese archivo. Elige un respaldo descargado desde esta app."); }
    t.value = "";
  };
  rd.onerror = () => { msg("No pude abrir el archivo."); t.value = ""; };
  rd.readAsText(f);
};
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

</script>
