.shell{max-width:560px;margin:0 auto;padding-block:14px 112px}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}

.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}

.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;min-width:36px;min-height:36px;cursor:pointer;border-radius:8px}

.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);

.ring{position:relative;width:176px;height:176px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:26px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid var(--water);background:transparent}
.drop.on{background:var(--water)}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.player .inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.bigtime{font-family:var(--display);font-weight:700;font-size:clamp(84px,28vw,140px);line-height:1;font-variant-numeric:tabular-nums}
.phase{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase}

.scroll-x{overflow-x:auto}

.note{font-size:12px;color:var(--muted)}

function expandRoutine(r){
  const steps = [];
  const mk = (b, set, sets) => steps.push({ex:b[0],kind:EX[b[0]].t,target:b[2],set,sets,rest:b[3]});
  if (r.circuit) {
    for (let v = 1; v <= r.rounds; v++) r.blocks.forEach(b => mk(b, v, r.rounds));
  } else {
    r.blocks.forEach(b => { for (let s = 1; s <= b[1]; s++) mk(b, s, b[1]); });
  }
  return steps;
}

async function initRemote() {
  if (ACTIVE !== "p1") return;
  try {
    const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
    if (!use) return;
    const [db, user] = await Promise.all([use("db"), use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    DB = db; UID = id;
    setSync("Sincronizando…");
    const pSnap = await refDoc("profile").get();
    const dSnap = await refDoc("profile").collection("days").orderBy("u", "desc").limit(400).get();
    const rp = pSnap.exists ? pSnap.data() : null;
    if (rp && (!S.profile || (rp.u || 0) > (S.profile.u || 0))) S.profile = JSON.parse(JSON.stringify(rp));
    else if (S.profile && (!rp || (S.profile.u || 0) > (rp.u || 0))) queueRemote("profile", "", S.profile);
    const remote = {};
    dSnap.docs.forEach(s => { remote[s.id] = s.data(); });
    Object.keys(remote).forEach(k => {
      if (!S.days[k] || (remote[k].u || 0) > (S.days[k].u || 0)) S.days[k] = JSON.parse(JSON.stringify(remote[k]));
    });
    Object.keys(S.days).forEach(k => {
      const d = S.days[k];
      if ((d.u || 0) > 0 && (!remote[k] || d.u > (remote[k].u || 0))) queueRemote("day", k, d);
    });
    lsSave();
    setSync("Guardado en tu cuenta");
    const ae = document.activeElement, typing = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.value;
    if (!$("#layer").firstChild && !$(".player") && !typing) render();

  }
}

// ---------- metas ----------
const bmi = p => p.peso / Math.pow(p.estatura / 100, 2);
function calcTargets(p) {
  const bmr = 10 * p.peso + 6.25 * p.estatura - 5 * p.edad + (p.sexo === "m" ? 5 : -161);
  const tdee = bmr * p.act;
  let goal = p.objetivo;
  if (goal === "bajar" && bmi(p) < 19) goal = "mantener";
  const adj = goal === "bajar" ? 0.85 : goal === "subir" ? 1.1 : 1;
  const floor = p.sexo === "m" ? 1500 : 1200;
  const kcal = Math.max(floor, Math.round(tdee * adj / 10) * 10);
  const prot = Math.round(p.peso * (goal === "mantener" ? 1.6 : 1.9));
  const fat = Math.round(kcal * 0.27 / 9);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  const agua = Math.max(1500, Math.round(p.peso * 35 / 250) * 250);
  return {kcal, prot, fat, carb, agua, tdee: Math.round(tdee), bmr: Math.round(bmr), goal, limited: goal !== p.objetivo};
}
function dayTotals(d) {
  const t = {k: 0, p: 0, c: 0, f: 0};
  MEALS.forEach(([id]) => (d.meals[id] || []).forEach(e => { t.k += e.k; t.p += e.p; t.c += e.c; t.f += e.f; }));
  return t;
}
const burned = d => (d.work || []).reduce((a, w) => a + (w.kcal || 0), 0);
function streak() {
  let n = 0, k = todayKey();
  const has = key => { const d = S.days[key]; return d && (dayTotals(getDay(key)).k > 0 || (d.work && d.work.length)); };
  if (!has(k)) k = addDays(k, -1);
  while (has(k)) { n++; k = addDays(k, -1); }
  return n;
}
function lastWeight(p) { const w = p.pesos && p.pesos.length ? p.pesos[p.pesos.length - 1].kg : p.peso; return w; }

let SCAN = null;
function stopScan() {
  if (!SCAN) return;

  try { if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  SCAN = null;
}
ACT.scan = async () => {
  stopScan();
  openSheet('<div class="stack"><div class="row between"><h2>Escanear código</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>' +
    '<video id="sc-v" playsinline muted style="width:100%;max-height:240px;border-radius:12px;background:#000;display:none"></video>' +
    '<p id="sc-msg" class="small muted" role="status">Apunta al código de barras del envase.</p>' +
    '<label class="f">O escribe el código (los números bajo las barras)<input id="sc-c" inputmode="numeric" maxlength="14" data-enter="scango" placeholder="Ej: 7801234567890"></label>' +
    '<button class="btn primary block" data-act="scango">Buscar producto</button>' +
    '<p class="note">Busca en Open Food Facts, una base abierta con datos que aportan usuarios. Puede faltar un producto o tener datos incompletos: compáralos con la etiqueta.</p>' +
    '<button class="btn ghost block" data-act="addfood" data-meal="' + VIEW.meal + '">Volver</button></div>');
  const me = SCAN = {on: true}, msg = t => { const m = $("#sc-msg"); if (m) m.textContent = t; };
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return msg("Este navegador no lee códigos con la cámara. Escribe los números del código.");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}}});
    if (SCAN !== me) { stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#sc-v"); v.srcObject = stream; v.style.display = "block"; await v.play();
    const det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a", "upc_e"]});
    me.iv = setInterval(async () => {
      if (SCAN !== me || me.busy) return;
      me.busy = true;
      try { const r = await det.detect(v); if (r.length && SCAN === me) { const c = r[0].rawValue; stopScan(); lookupCode(c); } } catch (e) {}
      me.busy = false;
    }, 400);
  } catch (e) { msg("No pude abrir la cámara. Revisa el permiso en Ajustes → Permisos de la app, o escribe el código."); }
};
ACT.scango = () => { const i = $("#sc-c"); if (i) { const c = i.value.replace(/\D/g, ""); stopScan(); lookupCode(c, true); } };
async function lookupCode(code, manual) {
  const show = t => { openSheet('<div class="stack"><div class="row between"><h2>Escanear código</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div><p class="muted" role="status">' + esc(t) + '</p><button class="btn block" data-act="scan">Intentar de nuevo</button><button class="btn ghost block" data-act="newfood">Crear alimento con la etiqueta</button></div>'); };
  if (!/^\d{8,14}$/.test(code)) return show("Ese código no parece válido. Debe tener entre 8 y 14 números.");
  if (!navigator.onLine) return show("Sin internet no puedo buscar el producto. Usa Crear alimento con la etiqueta.");
  openSheet('<div class="stack"><p class="muted" role="status">Buscando ' + esc(code) + "…</p></div>");
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
    const res = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code + ".json?fields=product_name,product_name_es,brands,nutriments,serving_quantity,serving_size", {signal: ctl.signal});
    clearTimeout(to);
    const j = await res.json(), p = j && j.status === 1 && j.product;
    if (!p) return show("No encontré ese producto. Usa Crear alimento con los datos de la etiqueta.");
    const nu = p.nutriments || {}, kcal = nu["energy-kcal_100g"] !== undefined ? Number(nu["energy-kcal_100g"]) : (nu.energy_100g !== undefined ? Number(nu.energy_100g) / 4.184 : NaN);
    if (!isFinite(kcal)) return show("Encontré el producto, pero no trae calorías. Usa Crear alimento con la etiqueta.");
    const nm = (p.product_name_es || p.product_name || "Producto " + code).trim(), br = (p.brands || "").split(",")[0].trim();
    const sq = Number(p.serving_quantity);
    const f = {n: (nm + (br ? " (" + br + ")" : "")).slice(0, 60), k: Math.round(kcal), p: Number(nu.proteins_100g) || 0, c: Number(nu.carbohydrates_100g) || 0, f: Number(nu.fat_100g) || 0,
      u: sq > 0 ? "1 porción" + (p.serving_size ? " (" + String(p.serving_size).slice(0, 20) + ")" : "") : "100 g", g: sq > 0 ? sq : 100, off: true};
    QTY = {f, mode: "p"}; openQty();
  } catch (e) { show("No pude consultar la base de datos. Revisa tu conexión e intenta otra vez."); }
}

// Importar entrenos de un reloj (TCX / GPX)
function parseActivity(txt) {
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("xml");
  const all = (n, tag) => Array.from(n.getElementsByTagName("*")).filter(e => e.localName === tag);
  const out = [];
  const tcx = all(doc, "Activity");
  tcx.forEach(a => {
    const id = all(a, "Id")[0], laps = all(a, "Lap");
    let sec = 0, kcal = 0, mx = 0, ws = 0, wn = 0;
    laps.forEach(l => {
      const t = Number((all(l, "TotalTimeSeconds")[0] || {}).textContent) || 0; sec += t;
      kcal += Number((all(l, "Calories")[0] || {}).textContent) || 0;
      const av = all(l, "AverageHeartRateBpm")[0], m = all(l, "MaximumHeartRateBpm")[0];
      const avv = av && Number((all(av, "Value")[0] || {}).textContent), mxv = m && Number((all(m, "Value")[0] || {}).textContent);
      if (avv) { ws += avv * t; wn += t; } if (mxv) mx = Math.max(mx, mxv);
    });
    const start = id ? new Date(id.textContent.trim()) : (laps[0] && new Date(laps[0].getAttribute("StartTime")));
    if (!start || isNaN(start) || !sec) return;
    out.push({start, sec, kcal, avg: wn ? Math.round(ws / wn) : 0, max: mx, sport: a.getAttribute("Sport") || "Entreno"});
  });
  if (out.length) return out;
  all(doc, "trk").forEach(t => {
    const pts = all(t, "trkpt"), times = pts.map(p => all(p, "time")[0]).filter(Boolean).map(e => new Date(e.textContent.trim())).filter(d => !isNaN(d));
    const hrs = all(t, "hr").map(e => Number(e.textContent)).filter(x => x > 30 && x < 230);
    if (times.length < 2) return;
    const sec = (times[times.length - 1] - times[0]) / 1000;
    out.push({start: times[0], sec, kcal: 0, avg: hrs.length ? Math.round(hrs.reduce((s, x) => s + x, 0) / hrs.length) : 0, max: hrs.length ? Math.max.apply(null, hrs) : 0, sport: (all(t, "type")[0] || {}).textContent || "Entreno"});
  });
  return out;
}
INP.relojfile = t => {

function weeklyData(offset) {

    if (tt.k > 0) { out.kcal += tt.k; out.prot += tt.p; out.kcalD++; }
    const sc = w * 3 + (d.agua > 0 ? 1 : 0) + (tt.k > 0 ? 1 : 0);
    if (sc > 0 && (!out.best || sc > out.best.sc)) out.best = {k, sc};

function resumenHTML() {

ACT.resumenana = async () => {

VIEW.med = "cint";
function medidasChart() {
  const k = VIEW.med, pts = [];
  for (let n = 0; n <= 12; n++) { const v = (wkR(n).m || {})[k]; if (v > 0) pts.push({n, v}); }
  const label = (MEDIDAS.find(m => m[0] === k) || [0, ""])[1];
  const chips = '<div class="chips" role="group" aria-label="Medida">' + MEDIDAS.map(([id, l]) => '<button type="button" data-act="medsel" data-k="' + id + '" aria-pressed="' + (k === id) + '">' + l + "</button>").join("") + "</div>";
  let body;

    const X = n => pl + (W - pl - pr) * n / 12, Y = v => pt + (H - pt - pb) * (1 - (v - mn) / r);

      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>' + pts.map(x => '<circle cx="' + X(x.n).toFixed(1) + '" cy="' + Y(x.v).toFixed(1) + '" r="3.5" fill="var(--accent)"/>').join("") +
      '<text x="4" y="' + (pt + 4) + '" font-size="10" fill="var(--muted)">' + fmt(mx, 1) + '</text><text x="4" y="' + (H - pb) + '" font-size="10" fill="var(--muted)">' + fmt(mn, 1) + '</text>' +
      [0, 4, 8, 12].map(n => '<text x="' + X(n).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + (n === 0 ? "Ini" : "S" + n) + "</text>").join("") + "</svg>" +
      '<p class="small muted">' + esc(label) + ": " + fmt(pts[0].v, 1) + " cm al inicio → " + fmt(pts[pts.length - 1].v, 1) + " cm (" + (pts[pts.length - 1].v - pts[0].v > 0 ? "+" : "") + fmt(pts[pts.length - 1].v - pts[0].v, 1) + " cm)</p>";
  }
  return '<div class="card stack s8"><h3>Evolución de medidas</h3>' + chips + body + "</div>";
}

function plgOpen(t) { const v = PLG[plgKey(t)]; return v === undefined ? !PLG_DEF.some(d => t.indexOf(d) === 0) : v === 1; }
function plgEnhance() {
